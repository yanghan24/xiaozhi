[unix_http_server]
file=/opt/xiaozhi-dev/run/supervisor.sock
chmod=0600
[supervisord]
nodaemon=false
logfile=/opt/xiaozhi-dev/logs/supervisord.log
pidfile=/opt/xiaozhi-dev/run/supervisord.pid
childlogdir=/opt/xiaozhi-dev/logs
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///opt/xiaozhi-dev/run/supervisor.sock
[program:api]
directory=/workspace/main/manager-api
command=/opt/java/openjdk/bin/java -Xms128m -Xmx768m -jar target/xiaozhi-esp32-api.jar --spring.config.additional-location=optional:file:/opt/xiaozhi-dev/speaker/speaker.properties
priority=10
autostart=true
autorestart=unexpected
startsecs=15
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/xiaozhi-dev/logs/api.log
stderr_logfile=/opt/xiaozhi-dev/logs/api-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
[program:web]
directory=/workspace/main/manager-web
command=/usr/local/bin/npm run serve -- --host 0.0.0.0
priority=20
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/xiaozhi-dev/logs/web.log
stderr_logfile=/opt/xiaozhi-dev/logs/web-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
[program:voice]
directory=/workspace/main/xiaozhi-server
command=/home/dev/.venv/bin/python app.py
priority=30
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/xiaozhi-dev/logs/voice.log
stderr_logfile=/opt/xiaozhi-dev/logs/voice-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
