# Optional LAN test ingress. Requires compose.yaml AND compose.voice.yaml from
# the verified voice baseline; this file alone does not provide those services.
# DEVICE_BIND_IP must be an explicit address assigned to this Docker host.
services:
  device-entry:
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    ports:
      - "${DEVICE_BIND_IP:?Set DEVICE_BIND_IP to the intended LAN interface}:${DEVICE_PORT:-18080}:80"
    configs:
      - source: device-entry-nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - voice
    mem_limit: 96m

configs:
  device-entry-nginx:
    file: ${DEVICE_ENTRY_NGINX_CONFIG:-./deploy/device-entry/nginx.conf}
