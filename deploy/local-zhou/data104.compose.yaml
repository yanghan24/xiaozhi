name: xiaozhi-dev-data
services:
  mysql:
    image: mysql:8.0.41@sha256:bf577825b52ab281d6281fb281eabbfdc73507eda8f2c2745790251533ef0306
    container_name: xiaozhi-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: xiaozhi_dev
      MYSQL_USER: xiaozhi_dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M", "--max-connections=60", "--performance-schema=OFF"]
    ports: ["172.16.18.104:13306:3306"]
    volumes: ["./data/mysql:/var/lib/mysql"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uxiaozhi_dev -D xiaozhi_dev -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
  redis:
    image: redis:8.0.0-alpine@sha256:0779069b3c24a47a2f681855c1c01d046793e7c5f7d2b079c2aa0652c42eaf0e
    container_name: xiaozhi-dev-redis
    restart: unless-stopped
    command: ["sh", "-c", "cp /usr/local/etc/redis/redis.conf /data/redis.conf && chown redis:redis /data/redis.conf && exec /usr/local/bin/docker-entrypoint.sh redis-server /data/redis.conf"]
    ports: ["172.16.18.104:16380:6379"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /usr/local/etc/redis/redis.conf) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
