# Public TLS ingress behind a TCP port mapping; not for HTTP gateway backends.
map $http_upgrade $xiaozhi_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name bridge.hncig.cn;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # Preserve the external :18443 authority through the TCP mapping.
    if ($host != bridge.hncig.cn) { return 404; }
    server_tokens off;
    client_max_body_size 1m;
    # Test evidence is recorded by the protocol client; avoid request identifiers
    # or query-string credentials appearing in this ingress's access log.
    access_log off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    location = /xiaozhi/ota/ {
        proxy_pass http://api:8002;
        proxy_read_timeout 30s;
    }

    location = /xiaozhi/ota/activate {
        proxy_pass http://api:8002;
        proxy_read_timeout 30s;
    }

    location = /xiaozhi/v1/ {
        proxy_pass http://voice:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xiaozhi_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ~ ^/xiaozhi/v1/ready/[A-Za-z0-9_-]+$ {
        proxy_pass http://voice:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    include /etc/nginx/customer-routes.conf;

    # Short-lived bearer URLs, checked against current device permission by voice.
    location ~ "^/xiaozhi/asr-audio/[A-Za-z0-9_-]{43}\.wav$" {
        limit_except GET { deny all; }
        proxy_pass http://voice:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        access_log off;
        error_log /dev/null crit;
    }

    location = /xiaozhi/device-control/v1/state {
        limit_except GET { deny all; }
        proxy_pass http://api:8002;
        proxy_read_timeout 35s;
        proxy_buffering off;
    }
    location = /xiaozhi/device-control/v1/requests {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://api:8002;
        proxy_read_timeout 30s;
    }
    location = /xiaozhi/device-control/v1/state-acks {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://api:8002;
        proxy_read_timeout 30s;
    }
    location = /xiaozhi/device-control/v1/account {
        limit_except GET { deny all; }
        proxy_pass http://api:8002;
        proxy_read_timeout 25s;
    }
    location = /xiaozhi/device-control/v1/sign-out {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://api:8002;
        proxy_read_timeout 25s;
    }

    location = /xiaozhi/device-control/v1/unbind {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://api:8002;
        proxy_read_timeout 25s;
    }

    location ~ "^/xiaozhi/device-delivery/v1/(authorize|operations|recoveries|device-check|(operations|recoveries)/[0-9a-f]{32}/complete)$" {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://api:8002;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        error_log /dev/null crit;
    }
    location ~ "^/xiaozhi/device-delivery/v1/(operations|recoveries)/[0-9a-f]{32}$" {
        limit_except GET { deny all; }
        proxy_pass http://api:8002;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        error_log /dev/null crit;
    }

    # Credential administration requires a current normal super-administrator login.
    location = /xiaozhi/device-delivery/v1/credentials {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://api:8002;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        error_log /dev/null crit;
    }
    location ~ "^/xiaozhi/device-delivery/v1/credentials/[0-9a-f]{32}/revoke$" {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://api:8002;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        error_log /dev/null crit;
    }

    # Firmware download routes require separate implementation.
    # Management pages, login/config APIs, uploads and all other routes stay
    # behind the loopback management listener and are not published here.
    location / {
        return 404;
    }
}
