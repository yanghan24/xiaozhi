# Include inside the trusted TLS server. No catch-all /customer or admin proxy.
location ~ "^/xiaozhi/bind/[A-Za-z0-9_-]{16,64}$" {
    limit_except GET { deny all; }
    proxy_pass http://api:8002;
}
location = /xiaozhi/customer/binding-flows {
    limit_except POST { deny all; }
    proxy_pass http://api:8002;
    proxy_read_timeout 30s;
}
location = /xiaozhi/customer/v1/binding-flows {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://api:8002;
    proxy_read_timeout 30s;
}
location ~ "^/xiaozhi/customer/v1/binding-flows/[A-Za-z0-9_-]{43}$" {
    limit_except GET { deny all; }
    proxy_pass http://api:8002;
}
location ~ "^/xiaozhi/customer/v1/binding-flows/[A-Za-z0-9_-]{43}/confirm$" {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://api:8002;
}
location ~ "^/xiaozhi/customer/(binding-flows|results)/[A-Za-z0-9_-]{43}$" {
    limit_except GET { deny all; }
    proxy_pass http://api:8002;
}
location ~ ^/xiaozhi/customer/identity-error/(400|401|409|410|502|503)$ {
    limit_except GET { deny all; }
    proxy_pass http://api:8002;
}
location = /xiaozhi/customer/oidc/callback {
    limit_except GET { deny all; }
    proxy_pass http://api:8002;
    proxy_read_timeout 30s;
}
location = /xiaozhi/customer/oidc/backchannel-logout {
    limit_except POST { deny all; }
    client_max_body_size 20k;
    proxy_pass http://api:8002;
    proxy_read_timeout 15s;
}
