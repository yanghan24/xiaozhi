# LAN test ingress only. TLS termination for a public endpoint is separate work.
map $http_upgrade $xiaozhi_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    # Test evidence is recorded by the protocol client; avoid request identifiers
    # or query-string credentials appearing in this ingress's access log.
    access_log off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    location = /xiaozhi/ota/ {
        proxy_pass http://api:8002;
        proxy_read_timeout 30s;
    }

    location = /xiaozhi/ota/activate {
        proxy_pass http://api:8002;
        proxy_read_timeout 30s;
    }

    location = /xiaozhi/v1/ {
        proxy_pass http://voice:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xiaozhi_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ~ ^/xiaozhi/v1/ready/[A-Za-z0-9_-]+$ {
        proxy_pass http://voice:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Management pages, login/config APIs, uploads and all other routes stay
    # behind the loopback management listener and are not published here.
    location / {
        return 404;
    }
}
